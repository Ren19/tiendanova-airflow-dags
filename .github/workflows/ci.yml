name: CI - TiendaNova DAGs

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint con ruff
        run: ruff check dags/ tests/

      - name: Inicializar metadata DB de Airflow (SQLite local)
        run: airflow db migrate

      - name: Tests con pytest (estructurales + unitarios)
        # Cosmos ejecuta "dbt ls" al parsear el DAG y dbt exige que las
        # env vars del profiles.yml existan. No se conecta a Snowflake,
        # por eso basta con valores ficticios.
        env:
          SNOWFLAKE_ACCOUNT: ci-dummy
          SNOWFLAKE_USER: ci-dummy
          SNOWFLAKE_PASSWORD: ci-dummy
        run: pytest tests/ -v
